
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0a">
  <title>Create Account | RudraVX Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090b0a;
      --panel: #111512;
      --input: #090c0a;
      --border: #252c27;
      --green: #20e678;
      --text: #f5f7f5;
      --muted: #929b94;
    }

    html[data-theme="white"] {
      --bg: #f5f7f5;
      --panel: #ffffff;
      --input: #ffffff;
      --border: #d4d9d5;
      --green: #15803d;
      --text: #111512;
      --muted: #626b64;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .signup-box {
      width: 100%;
      max-width: 360px;
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: 0 15px 45px #0002;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      text-decoration: none;
      min-width: 0;
    }

    .brand img {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .brand-name span {
      color: var(--green);
    }

    .theme {
      flex-shrink: 0;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
    }

    h1 {
      font-size: 23px;
      text-align: center;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text);
      margin: 13px 0 7px;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: var(--input);
      color: var(--text);
      font-size: 13px;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 0.85;
    }

    input:focus {
      border-color: var(--green);
    }

    .submit {
      width: 100%;
      margin-top: 19px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--green);
      color: #061109;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .submit:hover {
      opacity: 0.88;
    }

    .submit:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .notice {
      display: none;
      margin-top: 13px;
      padding: 10px;
      border-radius: 7px;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notice.show {
      display: block;
    }

    .notice.error {
      color: #ffb7b7;
      background: #351616;
      border: 1px solid #672929;
    }

    .notice.success {
      color: #aaffc9;
      background: #10281a;
      border: 1px solid #205b36;
    }

    .bottom {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .bottom a {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
      margin-left: 3px;
    }

    .bottom a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: var(--muted);
      font-size: 11px;
      text-decoration: none;
    }

    .back:hover {
      color: var(--green);
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 11px;
    }

    .footer span {
      color: var(--green);
    }

    @media (max-width: 400px) {
      .signup-box {
        padding: 22px 18px;
      }

      .brand-name {
        font-size: 16px;
      }

      .brand img {
        width: 35px;
        height: 35px;
      }

      h1 {
        font-size: 21px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="signup-box">

    <header class="top">
      <a class="brand" href="index.html">
        <img src="images/logo.jpeg" alt="RudraVX Logo">
        <div class="brand-name">Rudra<span>VX</span> Music</div>
      </a>

      <button class="theme" id="theme" type="button">
        ☼ White
      </button>
    </header>

    <h1>Create Account</h1>
    <p class="subtitle">
      Join RudraVX Music and create your account.
    </p>

    <form id="form">
      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="At least 6 characters"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        placeholder="Enter password again"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button class="submit" id="submit" type="submit">
        Create Account
      </button>
    </form>

    <div
      class="notice"
      id="notice"
      role="status"
      aria-live="polite"
    ></div>

    <div class="bottom">
      Already have an account?
      <a href="login.html">Sign In</a>
    </div>

    <a class="back" href="index.html">
      ← Back to Home
    </a>

    <p class="footer">
      Powered by <span>RudraVX Music</span>
    </p>

  </main>

  <script>
    const SUPABASE_URL =
      "https://mirxupauzfprafnestmq.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_37Z1dMQkgE9I2dOD-7aQjg_8t4rj9Vl";

    const $ = id => document.getElementById(id);

    // Theme toggle
    function setTheme(theme) {
      theme = theme === "black" ? "black" : "white";

      document.documentElement.dataset.theme = theme;

      $("theme").textContent =
        theme === "black" ? "☼ White" : "◐ Black";

      try {
        localStorage.setItem("rudravx-theme", theme);
      } catch (error) {}
    }

    let savedTheme = "black";

    try {
      savedTheme =
        localStorage.getItem("rudravx-theme") || "black";
    } catch (error) {}

    setTheme(savedTheme);

    $("theme").addEventListener("click", () => {
      const current =
        document.documentElement.dataset.theme;

      setTheme(current === "black" ? "white" : "black");
    });

    // Supabase setup
    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    function message(text, type = "error") {
      $("notice").textContent = text;
      $("notice").className = "notice show " + type;
    }

    // Create account
    $("form").addEventListener("submit", async event => {
      event.preventDefault();

      const email = $("email").value.trim();
      const password = $("password").value;
      const confirmPassword = $("confirmPassword").value;
      const button = $("submit");

      $("notice").className = "notice";

      if (password.length < 6) {
        message("Password must contain at least 6 characters.");
        return;
      }

      if (password !== confirmPassword) {
        message("Passwords do not match. Please try again.");
        $("confirmPassword").focus();
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            emailRedirectTo: window.location.origin + "/login.html"
          }
        });

        if (error) {
          throw error;
        }

        if (data.session) {
          message(
            "Account created successfully! Redirecting...",
            "success"
          );

          window.setTimeout(() => {
            window.location.replace("index.html");
          }, 1200);

        } else {
          message(
            "Account request successful! Check your email for a confirmation link. After confirming, sign in to continue.",
            "success"
          );
        }

      } catch (error) {
        message(
          error.message || "Signup failed. Please try again."
        );

      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>

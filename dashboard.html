
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RudraVX — Exit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 500px;
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 18px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #20d46b;
        }

        .icon {
            width: 70px;
            height: 70px;
            border: 2px solid #20d46b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 30px;
            color: #20d46b;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 14px;
        }

        p {
            color: #999;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button,
        a {
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.25s ease;
        }

        .exit-btn {
            background: #20d46b;
            color: #050505;
            border: 1px solid #20d46b;
        }

        .exit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(32, 212, 107, 0.25);
        }

        .cancel-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #333;
        }

        .cancel-btn:hover {
            border-color: #20d46b;
            color: #20d46b;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 25px;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            a {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">
            Rudra<span>VX</span>
        </div>

        <div class="icon">
            ?
        </div>

        <h1>We Have Received Your Request</h1>

        <p>
            We will review your request and get back to you soon.
        </p>

        <div class="buttons">

            <button class="exit-btn" onclick="exitPage()">
                Go Back to Home
            </button>

            <a href="foundation-apply.html" class="cancel-btn">
                Stay On This Page
            </a>

        </div>

    </div>

    <script>
        function exitPage() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>

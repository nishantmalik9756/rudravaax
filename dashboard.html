
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RudraVX — Exit</title>

    
    
      <style>
/* ========================================
   RUDRAVX EXIT PAGE
   Theme: White | Blue | Green
======================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #1769ff;
    --blue-dark: #1048bd;
    --green: #16a765;
    --text: #172033;
    --muted: #687386;
    --border: #e3eaf3;
    --white: #ffffff;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;

    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 15%,
            rgba(22, 167, 101, 0.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(23, 105, 255, 0.13),
            transparent 38%
        ),
        #f5f8fc;

    overflow-x: hidden;
}

/* MAIN CARD */

.box {
    position: relative;
    width: 100%;
    max-width: 570px;
    padding: 48px 42px;

    text-align: center;
    background: rgba(255, 255, 255, 0.96);

    border: 1px solid rgba(226, 234, 245, 0.95);
    border-radius: 26px;

    box-shadow:
        0 25px 70px rgba(23, 48, 90, 0.10),
        0 4px 14px rgba(23, 48, 90, 0.04);

    animation: cardEnter 0.65s ease both;
}

/* LOGO */

.logo {
    display: inline-block;
    margin-bottom: 35px;

    font-size: 29px;
    font-weight: 900;
    letter-spacing: -1.3px;
    color: var(--text);
}

.logo span {
    color: var(--blue);
}

/* QUESTION ICON */

.icon {
    width: 78px;
    height: 78px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 25px;

    border-radius: 24px;
    color: white;

    font-size: 36px;
    font-weight: 800;

    background: linear-gradient(
        135deg,
        var(--blue),
        #3987ff 55%,
        var(--green)
    );

    box-shadow: 0 12px 28px rgba(23, 105, 255, 0.22);

    animation: iconFloat 3s ease-in-out infinite;
}

/* HEADING */

.box h1 {
    max-width: 440px;
    margin: 0 auto 15px;

    font-size: clamp(27px, 5vw, 36px);
    line-height: 1.2;
    letter-spacing: -1.1px;
    font-weight: 850;
}

/* DESCRIPTION */

.box p {
    max-width: 410px;
    margin: 0 auto;

    color: var(--muted);
    font-size: 15px;
    line-height: 1.8;
}

/* BUTTON CONTAINER */

.buttons {
    display: flex;
    flex-direction: column;
    gap: 13px;

    margin-top: 32px;
}

/* SHARED BUTTON STYLES */

.exit-btn,
.cancel-btn {
    width: 100%;
    min-height: 51px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 13px 20px;
    border-radius: 13px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 750;
    text-align: center;
    text-decoration: none;

    cursor: pointer;
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
}

/* PRIMARY BUTTON */

.exit-btn {
    color: var(--white);
    border: none;

    background: linear-gradient(
        110deg,
        var(--blue),
        #3987ff
    );

    box-shadow: 0 8px 20px rgba(23, 105, 255, 0.20);
}

.exit-btn:hover {
    transform: translateY(-3px);

    background: linear-gradient(
        110deg,
        var(--blue-dark),
        var(--blue)
    );

    box-shadow: 0 12px 26px rgba(23, 105, 255, 0.28);
}

.exit-btn:active {
    transform: translateY(0);
}

/* SECONDARY BUTTON */

.cancel-btn {
    color: var(--text);
    background: #ffffff;
    border: 1px solid var(--border);
}

.cancel-btn:hover {
    color: var(--green);
    border-color: var(--green);
    background: #f3fff8;
    transform: translateY(-2px);
}

/* KEYBOARD ACCESSIBILITY */

.exit-btn:focus-visible,
.cancel-btn:focus-visible {
    outline: 3px solid rgba(23, 105, 255, 0.35);
    outline-offset: 4px;
}

/* ANIMATIONS */

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(22px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes iconFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

/* TABLET */

@media (max-width: 700px) {
    .box {
        max-width: 500px;
        padding: 40px 30px;
        border-radius: 23px;
    }

    .logo {
        margin-bottom: 29px;
    }

    .icon {
        width: 70px;
        height: 70px;
        border-radius: 21px;
        font-size: 32px;
    }
}

/* MOBILE */

@media (max-width: 480px) {
    body {
        padding: 17px;
    }

    .box {
        padding: 32px 21px;
        border-radius: 20px;
    }

    .logo {
        font-size: 25px;
        margin-bottom: 26px;
    }

    .icon {
        width: 63px;
        height: 63px;
        margin-bottom: 22px;
        border-radius: 19px;
        font-size: 29px;
    }

    .box h1 {
        font-size: 27px;
        letter-spacing: -0.7px;
    }

    .box p {
        font-size: 14px;
    }

    .buttons {
        margin-top: 27px;
        gap: 11px;
    }

    .exit-btn,
    .cancel-btn {
        min-height: 48px;
        font-size: 13px;
    }
}

/* SMALL MOBILE */

@media (max-width: 340px) {
    .box {
        padding: 28px 17px;
    }

    .box h1 {
        font-size: 24px;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
    }
}
</style>

</head>







<body>

    <div class="box">

        <div class="logo">
            Rudra<span>VX</span>
        </div>

        <div class="icon">
            ?
        </div>

        <h1>We Have Received Your Request</h1>

        <p>
            We will review your request and get back to you soon.
        </p>

        <div class="buttons">

            <button class="exit-btn" onclick="exitPage()">
                Go Back to Home
            </button>

            <a href="foundation-apply.html" class="cancel-btn">
                Stay On This Page
            </a>

        </div>

    </div>

    <script>
        function exitPage() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>

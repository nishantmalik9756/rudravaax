
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0a">
  <title>Login | RudraVX Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090b0a;
      --panel: #111512;
      --border: #252c27;
      --green: #20e678;
      --text: #f5f7f5;
      --muted: #929b94;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: 0 15px 45px #0006;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand-name span {
      color: var(--green);
    }

    h1 {
      font-size: 23px;
      text-align: center;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #d9dfda;
      margin: 13px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #090c0a;
      color: var(--text);
      font-size: 13px;
    }

    input:focus {
      border-color: var(--green);
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--green);
      color: #061109;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 13px;
      padding: 10px;
      border-radius: 7px;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #ffb7b7;
      background: #351616;
      border: 1px solid #672929;
    }

    .message.success {
      display: block;
      color: #aaffc9;
      background: #10281a;
      border: 1px solid #205b36;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 11px;
    }

    .footer span {
      color: var(--green);
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="brand">
      <img src="images/logo.jpeg" alt="RudraVX Logo">
      <div class="brand-name">Rudra<span>VX</span> Music</div>
    </div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to access your music ecosystem.</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">Sign In</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <p class="footer">Powered by <span>RudraVX Music</span></p>
  </main>

  <script>
    const SUPABASE_URL = "https://mirxupauzfprafnestmq.supabase.co";
    const SUPABASE_PUBLIC_KEY = "sb_publishable_37Z1dMQkgE9I2dOD-7aQjg_8t4rj9Vl";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");

    function showMessage(message, type = "error") {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    // If the user already has a valid session, open the website.
    async function checkExistingSession() {
      loginButton.disabled = true;
      loginButton.textContent = "Checking session...";

      const { data, error } = await supabaseClient.auth.getSession();

      if (error) {
        showMessage("Could not check your session. Please try again.");
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
        return;
      }

      if (data.session) {
        window.location.replace("index.html");
        return;
      }

      loginButton.disabled = false;
      loginButton.textContent = "Sign In";
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";
      messageBox.className = "message";

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          showMessage(error.message || "Login failed. Check your details.");
          loginButton.disabled = false;
          loginButton.textContent = "Sign In";
          return;
        }

        if (data.session) {
          showMessage("Login successful. Opening your music...", "success");
          window.location.replace("index.html");
          return;
        }

        showMessage("Login could not be completed. Please try again.");
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      } catch (error) {
        showMessage("Connection error. Check your internet and try again.");
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }
    });

    checkExistingSession();
  </script>
</body>
</html>

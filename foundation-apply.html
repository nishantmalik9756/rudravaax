
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RudraVX Foundation — Apply</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            padding: 55px 40px;
            border: 1px solid #222;
            border-radius: 20px;
            background: #0d0d0d;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #20d46b;
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 25px;
            border: 2px solid #20d46b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #20d46b;
        }

        h1 {
            font-size: 32px;
            line-height: 1.25;
            margin-bottom: 20px;
        }

        .message {
            color: #b5b5b5;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .date-box {
            border: 1px solid #2a2a2a;
            background: #111;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .date-label {
            display: block;
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .date {
            color: #20d46b;
            font-size: 20px;
            font-weight: 700;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            background: #20d46b;
            color: #050505;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(32, 212, 107, 0.25);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 22px;
            }

            h1 {
                font-size: 26px;
            }

            .message {
                font-size: 15px;
            }

            .date {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            Rudra<span>VX</span>
        </div>

        <div class="icon">
            !
        </div>

        <h1>
            We're Sorry
        </h1>

        <p class="message">
            You cannot apply for RudraVX Foundation yet.
            Because the Foundation is currently in its
            <strong>Working Phase</strong>.
            Once the development is complete, you will be able to apply.
        </p>

        <div class="date-box">
            <span class="date-label">
                Approximately Date To Start The Foundation
            </span>

            <div class="date">
                1 December 2026
            </div>
        </div>

        <a href="dashboard.html" class="back-btn">
            Back to Dashboard
        </a>

    </div>

</body>
</html>

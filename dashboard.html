
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RudraVX — Exit</title>

    <style>
        :root {
            --bg: #050505;
            --orange: #ff6a00;
            --orange-light: #ff8a2b;
            --white: #ffffff;
            --text: #e7e7e7;
            --muted: #999999;
            --border: rgba(255, 106, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 106, 0, 0.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 75%,
                    rgba(255, 106, 0, 0.10),
                    transparent 32%
                ),
                #050505;

            overflow: hidden;
        }


        /* =========================
           BACKGROUND GRID
        ========================= */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: 0.18;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                black,
                transparent
            );
        }


        /* =========================
           MAIN BOX
        ========================= */

        .box {
            position: relative;

            width: min(620px, 100%);

            padding: 55px 50px;

            text-align: center;

            border: 1px solid var(--border);

            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 106, 0, 0.07),
                    rgba(255,255,255,0.015)
                ),
                rgba(10, 10, 10, 0.88);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.65),
                0 0 50px rgba(255, 106, 0, 0.05);

            animation: boxIn 0.7s ease forwards;
        }


        /* Orange glow */

        .box::before {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            left: 50%;
            top: -160px;

            transform: translateX(-50%);

            background: var(--orange);

            opacity: 0.13;

            filter: blur(80px);

            border-radius: 50%;

            pointer-events: none;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            position: relative;

            margin-bottom: 35px;

            color: var(--white);

            font-size: 28px;

            font-weight: 900;

            letter-spacing: 2px;
        }

        .logo span {
            color: var(--orange);

            text-shadow:
                0 0 18px rgba(255, 106, 0, 0.4);
        }


        /* =========================
           ICON
        ========================= */

        .icon {
            width: 78px;
            height: 78px;

            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            border: 1px solid rgba(255, 106, 0, 0.35);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 106, 0, 0.16),
                    rgba(255, 106, 0, 0.025)
                );

            color: var(--orange);

            font-size: 30px;

            font-weight: 900;

            box-shadow:
                0 0 35px rgba(255, 106, 0, 0.12);

            animation: iconPulse 2.5s ease-in-out infinite;
        }


        /* =========================
           HEADING
        ========================= */

        h1 {
            position: relative;

            color: var(--white);

            font-size: clamp(28px, 5vw, 43px);

            line-height: 1.12;

            font-weight: 900;

            letter-spacing: -1.2px;

            margin-bottom: 18px;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        p {
            max-width: 460px;

            margin: 0 auto;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 14px;

            margin-top: 35px;

            flex-wrap: wrap;
        }


        .buttons button,
        .buttons a {
            min-height: 48px;

            padding: 13px 22px;

            border-radius: 999px;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease;
        }


        /* Main button */

        .exit-btn {
            border: 1px solid var(--orange);

            background: var(--orange);

            color: #000;

            box-shadow:
                0 8px 25px rgba(255, 106, 0, 0.15);
        }

        .exit-btn:hover {
            background: var(--orange-light);

            transform: translateY(-3px);

            box-shadow:
                0 12px 35px rgba(255, 106, 0, 0.30);
        }


        /* Secondary button */

        .cancel-btn {
            border: 1px solid rgba(255,255,255,0.13);

            background: rgba(255,255,255,0.035);

            color: #d0d0d0;
        }

        .cancel-btn:hover {
            color: var(--orange);

            border-color: rgba(255,106,0,0.35);

            background: rgba(255,106,0,0.05);

            transform: translateY(-3px);
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes boxIn {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        @keyframes iconPulse {

            0%,
            100% {
                box-shadow:
                    0 0 25px rgba(255,106,0,0.08);
            }

            50% {
                box-shadow:
                    0 0 40px rgba(255,106,0,0.20);
            }

        }


        /* =========================
           SELECTION
        ========================= */

        ::selection {
            background: var(--orange);
            color: #000;
        }


        /* =========================
           SCROLLBAR
        ========================= */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #050505;
        }

        ::-webkit-scrollbar-thumb {
            background: #292929;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--orange);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .box {
                padding: 42px 24px;

                border-radius: 21px;
            }

            .logo {
                font-size: 24px;

                margin-bottom: 28px;
            }

            .icon {
                width: 68px;
                height: 68px;

                font-size: 26px;

                margin-bottom: 23px;
            }

            h1 {
                font-size: 29px;
            }

            p {
                font-size: 14px;
            }

            .buttons {
                flex-direction: column;

                width: 100%;
            }

            .buttons button,
            .buttons a {
                width: 100%;
            }

        }


        @media (max-width: 380px) {

            .box {
                padding: 35px 20px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>







<body>

    <div class="box">

        <div class="logo">
            Rudra<span>VX</span>
        </div>

        <div class="icon">
            ?
        </div>

        <h1>We Have Received Your Request</h1>

        <p>
            We will review your request and get back to you soon.
        </p>

        <div class="buttons">

            <button class="exit-btn" onclick="exitPage()">
                Go Back to Home
            </button>

            <a href="foundation-apply.html" class="cancel-btn">
                Stay On This Page
            </a>

        </div>

    </div>

    <script>
        function exitPage() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
